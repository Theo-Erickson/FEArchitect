<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEArchitect Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07060f;
      --panel: rgba(26, 15, 56, 0.55);
      --panel-solid: #120b29;
      --line: rgba(79, 240, 255, 0.18);
      --cyan: #4ff0ff;
      --magenta: #ff4fd8;
      --text: #f2efff;
      --muted: #a99fd0;
      --ok: #5dffb0;
      --warn: #ffc24f;
      --err: #ff5a7a;
      --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
      --sans: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(255, 79, 216, 0.12), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(79, 240, 255, 0.10), transparent 60%),
        linear-gradient(rgba(79, 240, 255, 0.045) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, rgba(79, 240, 255, 0.045) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--bg);
      color: var(--text);
      font: 14px/1.45 var(--sans);
    }
    button { font: inherit; color: inherit; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }

    /* Glass panel with HUD corner brackets */
    .panel { position: relative; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
    .panel::before, .panel::after {
      content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
      border: 2px solid var(--cyan); opacity: 0.85;
    }
    .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
    .panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

    header.panel { display: flex; align-items: center; gap: 18px; padding: 14px 20px; flex-wrap: wrap; }
    .brand { font: 700 20px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    .brand b { color: var(--magenta); font-weight: 700; }
    .brand span { color: var(--cyan); }
    .tag { font: 11px var(--mono); color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
    .link { margin-left: auto; display: flex; gap: 16px; align-items: center; font: 12px var(--mono); color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 6px; box-shadow: 0 0 8px currentColor; vertical-align: 1px; }
    .dot.live { background: var(--ok); color: var(--ok); }

    .start { padding: 12px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .start strong { color: var(--text); font: 600 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
    .step { display: inline-flex; align-items: center; gap: 8px; }
    .step i { font: 700 11px var(--mono); font-style: normal; color: var(--bg); background: var(--cyan); width: 18px; height: 18px; display: inline-grid; place-items: center; }
    .step button { background: none; border: 0; padding: 0; color: var(--cyan); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
    .arrow { color: var(--magenta); }

    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 0.8fr); gap: 18px; flex: 1; align-items: start; }
    .groups { display: flex; flex-direction: column; gap: 22px; }
    .group h2 { margin: 0 0 10px; font: 600 12px var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--magenta); display: flex; align-items: center; gap: 10px; }
    .group h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255, 79, 216, 0.5), transparent); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }

    .card { padding: 14px 14px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s, background 0.15s; }
    .card::before, .card::after { opacity: 0; transition: opacity 0.15s; }
    .card:hover { border-color: rgba(79, 240, 255, 0.4); }
    .card.sel { border-color: var(--cyan); background: rgba(40, 22, 84, 0.7); }
    .card.sel::before, .card.sel::after { opacity: 1; }
    .card:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
    .top { display: flex; align-items: baseline; gap: 8px; }
    .card h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .pill { margin-left: auto; font: 600 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor; color: var(--muted); white-space: nowrap; }
    .pill.running { color: var(--cyan); box-shadow: 0 0 10px rgba(79, 240, 255, 0.35); }
    .pill.exited { color: var(--ok); }
    .pill.failed { color: var(--err); }
    .pill.console { color: var(--magenta); }
    .summary { margin: 0; }
    .when { margin: 0; font-size: 12.5px; color: var(--muted); }
    .when b { color: var(--cyan); font: 600 10px var(--mono); letter-spacing: 0.14em; margin-right: 4px; }
    .prereqs { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font: 11px var(--mono); padding: 1px 6px; border: 1px solid; }
    .chip.ok { color: var(--ok); border-color: rgba(93, 255, 176, 0.35); }
    .chip.miss { color: var(--warn); border-color: rgba(255, 194, 79, 0.5); }
    .chip.note { color: var(--muted); border-color: rgba(169, 159, 208, 0.35); }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .btn { cursor: pointer; padding: 5px 12px; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
    .btn:hover:not(:disabled) { background: rgba(79, 240, 255, 0.12); }
    .btn.primary { background: var(--cyan); color: var(--bg); }
    .btn.primary:hover:not(:disabled) { background: #8af6ff; }
    .btn.stop { border-color: var(--err); color: var(--err); }
    .btn.open { border-color: var(--magenta); color: var(--magenta); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    aside.panel { position: sticky; top: 18px; display: flex; flex-direction: column; height: calc(100vh - 36px); min-height: 360px; }
    .chead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .chead .row { display: flex; align-items: center; gap: 10px; }
    .chead h2 { margin: 0; font: 600 13px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan); }
    .chead code { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
    .chead .launcher { font-size: 11.5px; color: var(--muted); }
    .chead .launcher code { color: var(--text); }
    .clear { margin-left: auto; }
    pre#log { margin: 0; padding: 12px 16px; flex: 1; overflow: auto; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: rgba(4, 3, 10, 0.55); }
    pre#log .err { color: #ff9ab0; }
    pre#log .sys { color: var(--magenta); }
    pre#log .empty { color: var(--muted); }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside.panel { position: static; height: 420px; }
      .wrap { padding: 16px; }
      .link { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="panel">
      <div>
        <div class="brand"><b>FE</b>Architect <span>//</span> Hub</div>
        <div class="tag">FE8 encounter design sandbox · control panel</div>
      </div>
      <div class="link"><span id="conn"><span class="dot"></span>connecting</span></div>
    </header>

    <section class="panel start" aria-label="First-time setup">
      <strong>First time?</strong>
      <span class="step"><i>1</i> Put clean ROMs in <code>base/</code></span><span class="arrow">→</span>
      <span class="step"><i>2</i> <button data-go="import">Import Assets</button></span><span class="arrow">→</span>
      <span class="step"><i>3</i> <button data-go="maps">Generate Maps</button></span><span class="arrow">→</span>
      <span class="step"><i>4</i> <button data-go="gallery">Open the Gallery</button></span>
      <span class="step">· No ROM? The <button data-go="editor">Editor</button> and sims work without one.</span>
    </section>

    <main>
      <div class="groups" id="groups"></div>
      <aside class="panel" aria-label="Tool output">
        <div class="chead">
          <div class="row"><h2 id="ctitle">Output</h2><button class="btn clear" id="clear" title="Clear this log">Clear</button></div>
          <code id="ccmd">Pick a tool to see what it prints.</code>
          <div class="launcher" id="claunch"></div>
        </div>
        <pre id="log" aria-live="polite"><span class="empty">Nothing yet.</span></pre>
      </aside>
    </main>
  </div>
  <script type="module" src="/hub/client.ts"></script>
</body>
</html>
